[package]
name = "lugus-app"
version = "0.1.0"
edition = "2024"

[dependencies]
lugus-agent = { path = "../lugus-agent" }
sha2 = "0.10"
async-trait = "0.1.92"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
chrono = { version = "0.4.45", features = ["serde"] }
lugus-financial = { path = "../lugus-financial" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
