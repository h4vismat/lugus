[package]
name = "lugus-financial"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

num-bigint = "0.4.8"
num-traits = "0.2"

[dev-dependencies]
tempfile = "3"
