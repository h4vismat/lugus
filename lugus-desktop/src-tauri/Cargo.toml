[package]
name = "lugus-desktop"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "desktop_host"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "lugus-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
lugus-app = { path = "../../lugus-app" }
lugus-financial = { path = "../../lugus-financial" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tauri = { version = "2", optional = true , features = [] }

lugus-agent = { path = "../../lugus-agent" }
async-trait = "0.1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
